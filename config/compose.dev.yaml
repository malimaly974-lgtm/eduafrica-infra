services:
  backend:
    environment:
      # DEV UNIQUEMENT : autorise OAuth2 en HTTP. Jamais en production (HTTPS obligatoire).
      OAUTHLIB_INSECURE_TRANSPORT: "1"
    volumes:
      - ${EDU_CORE_PATH}:/home/frappe/frappe-bench/apps/edu_core
  websocket:
    volumes:
      - ${EDU_CORE_PATH}:/home/frappe/frappe-bench/apps/edu_core
  queue-short:
    volumes:
      - ${EDU_CORE_PATH}:/home/frappe/frappe-bench/apps/edu_core
  queue-long:
    volumes:
      - ${EDU_CORE_PATH}:/home/frappe/frappe-bench/apps/edu_core
  scheduler:
    volumes:
      - ${EDU_CORE_PATH}:/home/frappe/frappe-bench/apps/edu_core
  frontend:
    ports: !override
      - "127.0.0.1:8080:8080"
